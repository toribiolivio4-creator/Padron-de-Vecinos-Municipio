<div id="panel-padron" class="panel active">

    <!-- ===== VISTA PRINCIPAL: TABLA ===== -->
    <div id="vista-tabla-padron">
        <div class="section-header">
            <div class="section-title-block">
                <h2 class="section-title">Padrón de Vecinos</h2>
                <p class="section-subtitle">Registro completo de personas del municipio</p>
            </div>
            <button class="btn btn-primary" onclick="mostrarFormularioPadron()">
                ✏️ Modificar Datos
            </button>
        </div>

        <div class="search-bar-wrapper">
            <div class="search-input-group">
                <span class="search-icon">🔍</span>
                <input
                    type="text"
                    id="buscar-dni-padron"
                    class="search-input"
                    placeholder="Buscar por DNI..."
                    oninput="filtrarPadron(this.value)"
                    autocomplete="off"
                />
                <button class="search-clear" onclick="limpiarBusquedaPadron()" title="Limpiar búsqueda">✕</button>
            </div>
            <span class="search-count" id="padron-count"></span>
        </div>

        <div class="table-wrapper">
            <table class="data-table" id="tabla-padron">
                <thead>
                    <tr>
                        <th>DNI</th>
                        <th>Apellido</th>
                        <th>Nombre</th>
                        <th>Fecha Nac.</th>
                        <th>Domicilio</th>
                        <th>Localidad</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="padron-tbody">
                    <tr>
                        <td colspan="9" class="table-loading">
                            <span class="spinner"></span> Cargando datos...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ===== VISTA FORMULARIO: AGREGAR / ACTUALIZAR / ELIMINAR ===== -->
    <div id="vista-formulario-padron" style="display:none;">
        <div class="section-header">
            <div class="section-title-block">
                <h2 class="section-title">Gestión de Personas</h2>
                <p class="section-subtitle">Agregar, actualizar o eliminar un vecino del padrón</p>
            </div>
            <button class="btn btn-secondary" onclick="volverTablaPadron()">
                ← Volver al Padrón
            </button>
        </div>

        <div class="form-card">
            <div class="form-group">
                <label class="form-label" for="padron-dni">DNI *</label>
                <input type="text" id="padron-dni" class="form-input" placeholder="Ej: 30123456"
                    oninput="handleDniInputPadron(this.value)" maxlength="8" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="padron-apellido">Apellido *</label>
                    <input type="text" id="padron-apellido" class="form-input" placeholder="Apellido/s" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="padron-nombre">Nombre *</label>
                    <input type="text" id="padron-nombre" class="form-input" placeholder="Nombre/s" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="padron-fecha">Fecha de Nacimiento</label>
                    <input type="date" id="padron-fecha" class="form-input" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="padron-telefono">Teléfono</label>
                    <input type="text" id="padron-telefono" class="form-input" placeholder="Ej: 2337-123456" />
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="padron-domicilio">Domicilio</label>
                <input type="text" id="padron-domicilio" class="form-input" placeholder="Calle y número" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="padron-localidad">Localidad</label>
                    <input type="text" id="padron-localidad" class="form-input" placeholder="America" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="padron-email">Email</label>
                    <input type="email" id="padron-email" class="form-input" placeholder="correo@ejemplo.com" />
                </div>
            </div>
            <div class="form-row">
    <div class="form-group">
        <label class="form-label" for="padron-sexo">Sexo</label>
        <select id="padron-sexo" class="form-input">
            <option value="">— Seleccionar —</option>
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
            <option value="X">No binario</option>
        </select>
    </div>
    <div class="form-group">
        <label class="form-label" for="padron-ocupacion">Ocupación</label>
        <input type="text" id="padron-ocupacion" class="form-input" placeholder="Ej: Comerciante" />
    </div>
</div>

<div class="form-row">
    <div class="form-group">
        <label class="form-label" for="padron-estudios">Nivel de estudios</label>
        <select id="padron-estudios" class="form-input">
            <option value="No especificado">No especificado</option>
            <option value="Primario">Primario</option>
            <option value="Secundario">Secundario</option>
            <option value="Terciario">Terciario</option>
            <option value="Universitario">Universitario</option>
        </select>
    </div>
    <div class="form-group" style="display:flex; align-items:center; gap:1.5rem; padding-top:1.5rem;">
        <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;">
            <input type="checkbox" id="padron-jubilado" /> Jubilado
        </label>
        <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;">
            <input type="checkbox" id="padron-pensionado" /> Pensionado
        </label>
    </div>
</div>

            <div class="form-actions">
                <button class="btn btn-success" onclick="agregarPersona()">
                    ➕ Agregar Persona
                </button>
                <button class="btn btn-primary" onclick="actualizarPersona()" id="btn-actualizar-padron" disabled>
                    🔄 Actualizar Datos
                </button>
                <button class="btn btn-danger" onclick="eliminarPersona()" id="btn-eliminar-padron" disabled>
                    🗑️ Eliminar Registro
                </button>
            </div>

            <div id="padron-form-status" class="form-status"></div>
        </div>
    </div>

</div>

<!-- ===== MODAL DE CONFIRMACIÓN ===== -->
<div id="modal-confirmar" style="display:none; position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,0.45); align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:14px; border-top:4px solid var(--verde); box-shadow:0 8px 40px rgba(0,0,0,0.18); padding:32px 28px; max-width:420px; width:90%; font-family:var(--font);">
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
            <span style="font-size:24px;">🗑️</span>
            <h3 style="font-family:var(--font-head); font-size:16px; font-weight:700; color:var(--verde-oscuro);">Confirmar eliminación</h3>
        </div>
        <p id="modal-mensaje" style="font-size:14px; color:var(--texto); line-height:1.6; margin-bottom:24px;"></p>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button onclick="cerrarModal(false)" style="padding:9px 22px; border-radius:8px; border:1.5px solid var(--gris-borde-mid); background:#fff; color:var(--texto-sec); font-size:13px; font-weight:600; font-family:var(--font-head); cursor:pointer;">
                Cancelar
            </button>
            <button onclick="cerrarModal(true)" style="padding:9px 22px; border-radius:8px; border:none; background:var(--rojo); color:#fff; font-size:13px; font-weight:600; font-family:var(--font-head); cursor:pointer;">
                Sí, eliminar
            </button>
        </div>
    </div>
</div>
