<div id="panel-public-forms" class="panel">

  <div id="vista-lista-public-forms">
    <div class="section-header">
      <div class="section-title-block">
        <h2 class="section-title">Formularios Públicos</h2>
        <p class="section-subtitle">Completá los formularios disponibles</p>
      </div>
    </div>

    <div class="forms-grid" id="public-forms-grid">
      <div class="table-loading-wrapper">
        <span class="spinner"></span> Cargando formularios...
      </div>
    </div>
  </div>

  <div id="vista-formulario-publico" style="display:none;">
    <div class="section-header">
      <div class="section-title-block">
        <h2 class="section-title" id="public-form-title">Formulario</h2>
        <p class="section-subtitle" id="public-form-desc"></p>
      </div>
      <div class="editor-header-actions">
        <button class="btn btn-secondary btn-sm" onclick="verRespuestasAnteriores()">
          📋 Ver respuestas
        </button>
        <button class="btn btn-secondary" onclick="volverListaPublicForms()">
          ← Volver
        </button>
      </div>
    </div>

    <div class="form-card" style="max-width:800px;">
      <div id="public-form-dinamico"></div>
      <div class="form-actions" id="public-form-actions">
        <button class="btn btn-success" onclick="enviarFormularioPublico()">
          ➕ Enviar
        </button>
      </div>
      <div id="public-form-status" class="form-status"></div>
    </div>
  </div>

  <!-- Modal de respuestas anteriores -->
  <div id="modal-respuestas" class="gf-overlay" style="display:none;" onclick="cerrarModalRespuestas(event)">
    <div class="modal-respuestas-content" onclick="event.stopPropagation()">
      <div class="modal-respuestas-header">
        <div style="display:flex; align-items:center; gap:1rem; flex:1; min-width:0;">
          <h3 style="white-space:nowrap;">Respuestas anteriores: <span id="modal-respuestas-title"></span></h3>
          <div class="search-input-group" style="max-width:300px; margin-left:auto;">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-respuestas" class="search-input" placeholder="Buscar por DNI, nombre, apellido..." oninput="filtrarRespuestas(this.value)">
            <button class="search-clear" onclick="limpiarBusquedaRespuestas()" title="Limpiar búsqueda">&times;</button>
          </div>
        </div>
        <button class="modal-respuestas-close" onclick="cerrarModalRespuestas()">&times;</button>
      </div>
      <div class="modal-respuestas-body">
        <div id="modal-respuestas-loading" class="table-loading-wrapper">
          <span class="spinner"></span> Cargando respuestas...
        </div>
        <div id="modal-respuestas-empty" class="table-empty" style="display:none;">No hay respuestas anteriores.</div>
        <div id="modal-respuestas-table-wrapper" style="display:none;">
          <table class="data-table" id="modal-respuestas-table">
            <thead id="modal-respuestas-thead"></thead>
            <tbody id="modal-respuestas-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de detalle de respuesta -->
  <div id="modal-detalle-respuesta" class="gf-overlay" style="display:none;" onclick="cerrarDetalleRespuesta(event)">
    <div class="detalle-respuesta-content" onclick="event.stopPropagation()">
      <div class="detalle-respuesta-header">
        <h3>Detalle de respuesta</h3>
        <button class="modal-respuestas-close" onclick="cerrarDetalleRespuesta()">&times;</button>
      </div>
      <div class="detalle-respuesta-body" id="detalle-respuesta-body">
      </div>
    </div>
  </div>

</div>
