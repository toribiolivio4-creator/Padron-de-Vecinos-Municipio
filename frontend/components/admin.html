<div id="panel-admin" class="panel">

  <!-- ===== LISTA DE FORMULARIOS ===== -->
  <div id="vista-lista-admin">
    <div class="section-header">
      <div class="section-title-block">
        <h2 class="section-title">Administrador de Formularios</h2>
        <p class="section-subtitle">Crear, editar y gestionar formularios dinámicos</p>
      </div>
      <button class="btn btn-primary" onclick="mostrarCrearFormulario()">
        + Nuevo Formulario
      </button>
    </div>

    <div class="search-bar-wrapper">
      <div class="search-input-group">
        <input type="text" id="buscar-form-admin" class="search-input" placeholder="Buscar formulario..." oninput="filtrarFormsAdmin(this.value)" autocomplete="off" />
        <button class="search-clear" onclick="limpiarBusquedaForms()" title="Limpiar búsqueda">✕</button>
      </div>
      <span class="search-count" id="admin-forms-count"></span>
    </div>

    <div class="forms-grid" id="admin-forms-grid">
      <div class="table-loading-wrapper">
        <span class="spinner"></span> Cargando formularios...
      </div>
    </div>
  </div>

  <!-- ===== EDITOR TIPO GOOGLE FORMS ===== -->
  <div id="vista-editor-admin" style="display:none;">

    <!-- Barra superior -->
    <div class="gf-topbar">
      <div class="gf-topbar-left">
        <button class="gf-btn-back" onclick="volverListaAdmin()">
          ← Volver
        </button>
        <span id="gf-status-badge" class="gf-status-badge">Nuevo formulario</span>
      </div>
      <div class="gf-topbar-right">
        <button class="gf-btn gf-btn-primary" onclick="guardarFormulario()" id="btn-guardar-form">
          Guardar
        </button>
      </div>
    </div>

    <div class="gf-editor-container">

      <!-- Header del formulario (título + descripción) -->
      <div class="gf-form-header">
        <div class="gf-color-bar"></div>
        <input type="text" id="gf-form-title" class="gf-title-input" placeholder="Título del formulario" autocomplete="off" />
        <textarea id="gf-form-desc" class="gf-desc-input" placeholder="Descripción del formulario (opcional)" rows="2"></textarea>
      </div>

      <!-- Secciones y preguntas -->
      <div id="gf-questions-container"></div>

      <!-- Botones de acción -->
      <div class="gf-actions-bar">
        <button class="gf-btn gf-btn-add" onclick="mostrarSelectorTipoPregunta()">
          + Agregar pregunta
        </button>
      </div>

      <!-- Preview de migración -->
      <div id="admin-migration-status" class="gf-migration-status" style="display:none;"></div>

    </div>
  </div>

</div>

<!-- ===== SELCTOR DE TIPO DE PREGUNTA (mini modal) ===== -->
<div id="gf-type-selector" class="gf-overlay" style="display:none;">
  <div class="gf-type-modal">
    <h3>Elegí un tipo de pregunta</h3>
    <div class="gf-type-grid">
      <div class="gf-type-option" data-type="string" onclick="crearPreguntaConTipo('string')">
        <span class="gf-type-icon">Aa</span>
        <span class="gf-type-name">Texto corto</span>
      </div>
      <div class="gf-type-option" data-type="text" onclick="crearPreguntaConTipo('text')">
        <span class="gf-type-icon">¶</span>
        <span class="gf-type-name">Párrafo</span>
      </div>
      <div class="gf-type-option" data-type="select" onclick="crearPreguntaConTipo('select')">
        <span class="gf-type-icon">◎</span>
        <span class="gf-type-name">Múltiple opción</span>
      </div>
      <div class="gf-type-option" data-type="checkbox" onclick="crearPreguntaConTipo('checkbox')">
        <span class="gf-type-icon">☑</span>
        <span class="gf-type-name">Casillas</span>
      </div>
      <div class="gf-type-option" data-type="date" onclick="crearPreguntaConTipo('date')">
        <span class="gf-type-icon">📅</span>
        <span class="gf-type-name">Fecha</span>
      </div>
      <div class="gf-type-option" data-type="number" onclick="crearPreguntaConTipo('number')">
        <span class="gf-type-icon">#</span>
        <span class="gf-type-name">Número</span>
      </div>
      <div class="gf-type-option" data-type="email" onclick="crearPreguntaConTipo('email')">
        <span class="gf-type-icon">@</span>
        <span class="gf-type-name">Email</span>
      </div>
      <div class="gf-type-option" data-type="boolean" onclick="crearPreguntaConTipo('boolean')">
        <span class="gf-type-icon">✓</span>
        <span class="gf-type-name">Sí/No</span>
      </div>
    </div>
    <button class="gf-btn gf-btn-outline" onclick="cerrarSelectorTipo()" style="margin-top:16px; width:100%;">Cancelar</button>
  </div>
</div>

<!-- ===== MODAL: RESULTADO DE GENERACIÓN ===== -->
<div id="modal-generacion" class="gf-overlay" style="display:none;">
  <div style="background:#fff; border-radius:14px; border-top:4px solid var(--verde, #3a7d3a); box-shadow:0 8px 40px rgba(0,0,0,0.18); padding:28px; max-width:520px; width:90%; font-family:var(--font);">
    <h3 style="font-family:'Montserrat',sans-serif; font-size:16px; font-weight:700; margin-bottom:16px;">Código Generado</h3>
    <div id="generacion-result" style="font-size:14px; line-height:1.6;"></div>
    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
      <button onclick="document.getElementById('modal-generacion').style.display='none'" class="gf-btn gf-btn-outline">Cerrar</button>
    </div>
  </div>
</div>
